/**
 * Measures how long generated projects take to compile after a change, with Gradle alone and with the plugin. It is not
 * part of the build:
 *
 *     ./gradlew benchmark -Pbenchmark.size=small
 *
 * The Gradle properties it takes are described in Benchmark. The results are written to build/benchmark/results.md.
 */

sourceSets {
    benchmark
}

dependencies {
    // the Tooling API, which runs the builds
    benchmarkImplementation gradleTestKit()
    benchmarkImplementation localGroovy()
}

// compiled by the build, run by hand
tasks.named('check') {
    dependsOn 'benchmarkClasses'
}

def benchmarkDirectory = layout.buildDirectory.dir('benchmark')
def benchmarkRepository = layout.buildDirectory.dir('benchmark-repository')

// the generated projects take the plugin from here
publishing {
    repositories {
        maven {
            name = 'benchmark'
            url = benchmarkRepository
        }
    }
}

tasks.register('benchmark', JavaExec) {
    group = 'verification'
    description = 'Measures how long generated projects take to compile after a change, with Gradle alone and with the plugin.'
    dependsOn 'publishAllPublicationsToBenchmarkRepository'
    classpath = sourceSets.benchmark.runtimeClasspath
    mainClass = 'io.github.jdaugherty.incrementalgroovy.benchmark.Benchmark'
    maxHeapSize = '512m'
    systemProperty 'benchmark.output', benchmarkDirectory.get().asFile.path
    systemProperty 'benchmark.repository', benchmarkRepository.get().asFile.path
    systemProperty 'benchmark.pluginVersion', version.toString()
    systemProperty 'benchmark.gradleInstallation', gradle.gradleHomeDir.path
    ['size', 'seed', 'warmUpBuilds', 'warmUps', 'runs', 'setups', 'scenarios', 'gradleVersion'].each { String name ->
        def value = providers.gradleProperty("benchmark.${name}")
        if (value.present) {
            systemProperty "benchmark.${name}", value.get()
        }
    }
}
