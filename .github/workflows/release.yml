name: Release

# Pushing a tag such as v0.1.0 uploads that version to the Central Portal, where it waits to be released by hand at
# https://central.sonatype.com/publishing/deployments
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Version from the tag
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: ./gradlew build -Pversion="$RELEASE_VERSION"
      - run: ./gradlew publishToMavenCentral -Pversion="$RELEASE_VERSION"
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
