name: Benchmark

# Run by hand from the Actions tab. The results are in the summary of the run, and with each run and the build logs
# in its artifact.
on:
  workflow_dispatch:
    inputs:
      size:
        description: The size of the generated project
        type: choice
        options: [small, medium, large]
        default: large
      modules:
        description: The feature modules to spread the entities over, 0 for none
        type: number
        default: 0
      runs:
        description: The measured runs of each change
        type: number
        default: 5

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew benchmark -Pbenchmark.size="$SIZE" -Pbenchmark.modules="$MODULES" -Pbenchmark.runs="$RUNS"
        env:
          SIZE: ${{ inputs.size }}
          MODULES: ${{ inputs.modules }}
          RUNS: ${{ inputs.runs }}
      - name: Summary
        if: always()
        run: |
          if [ -f build/benchmark/results.md ]; then
            cat build/benchmark/results.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ inputs.size }}-${{ inputs.modules }}-modules
          path: |
            build/benchmark/results.md
            build/benchmark/results.csv
            build/benchmark/logs
          if-no-files-found: ignore
